            get: function () {
              return activeFetch;
            },
            set: function (newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || (typeof Window !== 'undefined' && Window.prototype);
            if (proto) {

                },
